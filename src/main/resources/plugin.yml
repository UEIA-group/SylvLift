name: SylvLift
version: 1.0.0
main: com.sylvarion.sylvlift.SylvLiftPlugin
api-version: '26.3'
description: Player-built elevators with animated platforms and doors.
authors: [Sylvarion]
commands:
  sylvlift:
    description: Manage SylvLift elevators.
    usage: /sylvlift <reload|delete|edit> <id>
permissions:
  sylvlift.reload:
    description: Rescan a lift for new floors.
    default: op
  sylvlift.delete:
    description: Delete a lift.
    default: op
  sylvlift.edit:
    description: Edit lift floor names.
    default: op
